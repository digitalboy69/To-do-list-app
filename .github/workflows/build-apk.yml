name: Build APK

on:
  push:
    branches: [main, master]
    # Docs-only changes do not need a new APK or release.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle 8.9 (the version AGP 8.7 needs), so no gradlew wrapper is required.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Fixed signing key, kept right here on purpose (personal sideloaded app). Every build is
      # signed the same way, which is what lets an update install over the previous version.
      # To use your own private key instead, add the repo secrets KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD and KEY_ALIAS; they override the key below.
      - name: Prepare signing key
        env:
          DEFAULT_KEYSTORE_BASE64: ""
          DEFAULT_KEYSTORE_PASSWORD: "14a99d0b7bfc86ee312e6b7b"
          DEFAULT_KEY_ALIAS: "taskmaster"
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          echo "${SECRET_KEYSTORE_BASE64:-$DEFAULT_KEYSTORE_BASE64}" | base64 -d > "$KS"
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD:-$DEFAULT_KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-$DEFAULT_KEY_ALIAS}"
            echo "KEY_PASSWORD=${SECRET_KEYSTORE_PASSWORD:-$DEFAULT_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      # Release build: signed, with R8 code shrinking and resource shrinking turned on.
      # Every run gets its own version (1.0.<run number>) so the app can tell a build is newer.
      - name: Build release APK
        run: >
          gradle assembleRelease --stacktrace
          -PappVersionName=1.0.${{ github.run_number }}
          -PappVersionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TaskMaster.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskMaster-apk
          path: TaskMaster.apk
          if-no-files-found: error

      # Every push to main publishes a new release (v1.0.<run number>) with the APK attached.
      # The app checks the latest release on launch and offers the update.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: TaskMaster 1.0.${{ github.run_number }}
          files: TaskMaster.apk
          generate_release_notes: true
          make_latest: true
